<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management App</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2 {
            color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input, button {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        input {
            flex: 1;
            min-width: 180px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li.student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        li.student-item:last-child {
            border-bottom: none;
        }

        .student-actions {
            display: flex;
            gap: 6px;
        }

        .edit-btn {
            background-color: var(--warning);
            padding: 5px 10px;
            font-size: 12px;
        }

        .delete-btn {
            background-color: var(--danger);
            padding: 5px 10px;
            font-size: 12px;
        }

        /* Плеер */
        .player-container {
            position: relative;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .suggestions div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .suggestions div:hover {
            background: #f1f5f9;
        }

        .track-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .track-item:hover {
            background: #f8fafc;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        /* Чат */
        .chat-box {
            height: 300px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .chat-msg b {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Музыкальный плеер и Управление студентами</h1>

    <!-- 1. Музыкальный плеер (теперь сверху) -->
    <div class="card player-container">
        <h2>🎵 Музыкальный плеер (Чаты + Jamendo)</h2>
        <div class="form-group">
            <div style="position: relative; flex: 1;">
                <input type="text" id="searchInput" placeholder="Введите название трека или жанр..." oninput="handleSearchInput(this.value)">
                <div id="suggestionsBox" class="suggestions"></div>
            </div>
            <button onclick="searchMusic(document.getElementById('searchInput').value)">Искать</button>
        </div>
        <p id="nowPlaying" style="font-weight: bold; color: var(--text-muted);">Сейчас ничего не играет</p>
        <audio id="audioPlayer" controls></audio>
        <ul id="trackList" class="track-list"></ul>
    </div>

    <!-- 2. Чат студентов (в середине) -->
    <div class="card">
        <h2>💬 Чат студентов</h2>
        <div class="form-group" style="margin-bottom: 10px;">
            <input type="text" id="username" placeholder="Ваше имя" style="max-width: 150px;">
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="form-group">
            <input type="text" id="chatText" placeholder="Введите сообщение...">
            <input type="file" id="chatFile" style="display: none;" onchange="uploadFile()">
            <button onclick="document.getElementById('chatFile').click()">📎</button>
            <button onclick="sendMessage()">Отправить</button>
        </div>
        <div id="fileStatus" style="font-size: 12px; color: var(--text-muted);"></div>
    </div>

    <!-- 3. Список студентов (внизу) -->
    <div class="card">
        <h2>🎓 Список студентов</h2>
        <div class="form-group">
            <input type="text" id="name" placeholder="Имя студента">
            <input type="text" id="group" placeholder="Группа">
            <input type="text" id="specialty" placeholder="Специальность">
            <button onclick="addStudent()">Добавить</button>
        </div>
        <ul id="studentList"></ul>
    </div>
</div>

<script>
    const socket = io();

    // --- СТУДЕНТЫ ---
    async function loadStudents() {
        try {
            const res = await fetch('/api/students');
            const students = await res.json();
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            students.forEach(s => {
                list.innerHTML += `
                    <li class="student-item">
                        <span><b>[ID: ${s.id}]</b> ${escapeHtml(s.name)} — Группа: ${escapeHtml(s.group_name)} | Специальность: ${escapeHtml(s.specialty)}</span>
                        <div class="student-actions">
                            <button class="edit-btn" onclick="editStudent(${s.id}, '${escapeHtml(s.name)}', '${escapeHtml(s.group_name)}', '${escapeHtml(s.specialty)}')">Изменить</button>
                            <button class="delete-btn" onclick="deleteStudent(${s.id})">Удалить</button>
                        </div>
                    </li>`;
            });
        } catch (e) { console.error("Ошибка загрузки студентов", e); }
    }

    async function addStudent() {
        const name = document.getElementById('name').value;
        const group_name = document.getElementById('group').value;
        const specialty = document.getElementById('specialty').value;
        if (!name || !group_name || !specialty) return alert('Заполните все поля!');

        await fetch('/api/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, group_name, specialty })
        });
        document.getElementById('name').value = '';
        document.getElementById('group').value = '';
        document.getElementById('specialty').value = '';
        loadStudents();
    }

    async function editStudent(id, oldName, oldGroup, oldSpecialty) {
        const name = prompt("Измените имя студента:", oldName);
        if (name === null) return;
        const group_name = prompt("Измените группу:", oldGroup);
        if (group_name === null) return;
        const specialty = prompt("Измените специальность:", oldSpecialty);
        if (specialty === null) return;

        if (!name.trim() || !group_name.trim() || !specialty.trim()) {
            return alert('Поля не могут быть пустыми!');
        }

        await fetch(`/api/students/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, group_name, specialty })
        });
        loadStudents();
    }

    async function deleteStudent(id) {
        await fetch(`/api/students/${id}`, { method: 'DELETE' });
        loadStudents();
    }

    // --- ПЛЕЕР И ПОИСК ---
    let searchTimeout;
    async function handleSearchInput(query) {
        clearTimeout(searchTimeout);
        const box = document.getElementById('suggestionsBox');
        if (!query || query.length < 2) {
            box.style.display = 'none';
            return;
        }
        searchTimeout = setTimeout(async () => {
            try {
                const localRes = await fetch("/api/local-tracks");
                const localTracks = await localRes.json();
                const filteredLocal = localTracks.filter(t => t.name.toLowerCase().includes(query.toLowerCase())).slice(0, 3);

                const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=599eed81&format=json&limit=5&search=${encodeURIComponent(query)}`);
                const data = await res.json();
                const jamendoTracks = data.results || [];

                box.innerHTML = '';
                const all = [
                    ...filteredLocal.map(t => ({ ...t, isLocal: true })),
                    ...jamendoTracks.map(t => ({ name: t.name, artist_name: t.artist_name, audio: t.audio, isLocal: false }))
                ];

                if (all.length === 0) {
                    box.style.display = 'none';
                    return;
                }

                all.forEach(t => {
                    const div = document.createElement('div');
                    div.innerHTML = t.isLocal ? `💬 <b>${escapeHtml(t.name)}</b>` : `🎵 ${escapeHtml(t.name)} — <span style="color:gray;">${escapeHtml(t.artist_name)}</span>`;
                    div.onclick = () => {
                        document.getElementById('audioPlayer').src = t.audio;
                        document.getElementById('audioPlayer').play();
                        document.getElementById('nowPlaying').textContent = `Сейчас играет: ${t.name} — ${t.artist_name}`;
                        box.style.display = 'none';
                        document.getElementById('searchInput').value = t.name;
                    };
                    box.appendChild(div);
                });
                box.style.display = 'block';
            } catch (e) { console.error(e); }
        }, 300);
    }

    async function searchMusic(query) {
        if (!query) return;
        document.getElementById('suggestionsBox').style.display = "none";
        const trackList = document.getElementById('trackList');
        trackList.innerHTML = `<li style="text-align: center; color: var(--text-muted); padding: 10px;">Ищем музыку...</li>`;
        
        try {
            const localRes = await fetch("/api/local-tracks");
            const localTracks = await localRes.json();
            const filteredLocal = localTracks.filter(t => t.name.toLowerCase().includes(query.toLowerCase()) || t.artist_name.toLowerCase().includes(query.toLowerCase()));

            const jamendoRes = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=599eed81&format=json&limit=10&search=${encodeURIComponent(query)}`);
            const jamendoData = await jamendoRes.json();
            const jamendoTracks = jamendoData.results || [];

            const allFoundTracks = [
                ...filteredLocal.map(t => ({ ...t, isLocal: true })),
                ...jamendoTracks.map(t => ({ name: t.name, artist_name: t.artist_name, audio: t.audio, isLocal: false }))
            ];

            trackList.innerHTML = "";
            if (allFoundTracks.length === 0) {
                trackList.innerHTML = `<li style="text-align: center; color: var(--text-muted); padding: 10px;">Ничего не найдено</li>`;
                return;
            }

            allFoundTracks.forEach(track => {
                const li = document.createElement("li");
                li.className = "track-item";
                const badge = track.isLocal ? "💬 [Из чата]" : "🎵";
                li.innerHTML = `<span>${badge} <b>${escapeHtml(track.name)}</b> — <span style="color:var(--text-muted);">${escapeHtml(track.artist_name)}</span></span> <span>▶ Слушать</span>`;
                
                li.onclick = () => {
                    const audioPlayer = document.getElementById('audioPlayer');
                    audioPlayer.src = track.audio;
                    audioPlayer.play();
                    document.getElementById('nowPlaying').textContent = `Сейчас играет: ${track.name} — ${track.artist_name}`;
                };

                trackList.appendChild(li);
            });
        } catch (err) {
            trackList.innerHTML = `<li style="text-align: center; color: var(--danger); padding: 10px;">Ошибка поиска музыки</li>`;
        }
    }

    // --- ЧАТ И СОКЕТЫ ---
    let uploadedFileCache = null;

    async function uploadFile() {
        const fileInput = document.getElementById('chatFile');
        if (fileInput.files.length === 0) return;
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        document.getElementById('fileStatus').textContent = 'Загрузка файла...';
        try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.fileUrl) {
                uploadedFileCache = data;
                document.getElementById('fileStatus').textContent = `Файл прикреплен: ${data.originalName}`;
            } else {
                document.getElementById('fileStatus').textContent = 'Ошибка загрузки';
            }
        } catch(e) {
            document.getElementById('fileStatus').textContent = 'Ошибка сети при загрузке';
        }
    }

    function sendMessage() {
        const username = document.getElementById('username').value.trim() || 'Аноним';
        const text = document.getElementById('chatText').value.trim();
        
        if (!text && !uploadedFileCache) return;

        const messageData = {
            username,
            text: text || (uploadedFileCache ? uploadedFileCache.originalName : ''),
            fileUrl: uploadedFileCache ? uploadedFileCache.fileUrl : null,
            fileType: uploadedFileCache ? uploadedFileCache.fileType : null
        };

        socket.emit('chat_message', messageData);

        document.getElementById('chatText').value = '';
        document.getElementById('chatFile').value = '';
        uploadedFileCache = null;
        document.getElementById('fileStatus').textContent = '';
    }

    socket.on('init_messages', (messages) => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        messages.forEach(appendMessage);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('chat_message', (msg) => {
        appendMessage(msg);
        const box = document.getElementById('chatBox');
        box.scrollTop = box.scrollHeight;
    });

    function appendMessage(msg) {
        const box = document.getElementById('chatBox');
        let content = `<div class="chat-msg"><b>${escapeHtml(msg.username)}:</b> ${escapeHtml(msg.text || '')}`;
        
        if (msg.fileUrl) {
            if (msg.fileType === 'image') {
                content += `<br><img src="${msg.fileUrl}" style="max-width: 200px; border-radius: 6px; margin-top: 5px;">`;
            } else if (msg.fileType === 'audio') {
                content += `<br><audio controls src="${msg.fileUrl}" style="width: 100%; margin-top: 5px;"></audio>`;
            } else if (msg.fileType === 'video') {
                content += `<br><video controls src="${msg.fileUrl}" style="max-width: 250px; border-radius: 6px; margin-top: 5px;"></video>`;
            } else {
                content += `<br><a href="${msg.fileUrl}" target="_blank">📄 Скачать файл</a>`;
            }
        }
        content += `</div>`;
        box.innerHTML += content;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadStudents();
</script>

</body>
</html>
